name: Cloud Trading Bot Runner

on:
  workflow_dispatch: # Permet le déclenchement manuel et via l'API REST GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 1. Crucial : donne le droit au bot GitHub de modifier et pousser sur le dépôt

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🚀 Execute Trading Bot / run_bot.sh
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd src/trading_bot
          chmod +x run_bot.sh
          ./run_bot.sh

      - name: 🔄 Commit and push updated scanner results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Si le fichier a été généré dans src/trading_bot/, on le copie à la racine pour Streamlit et Git
          if [ -f src/trading_bot/scanner_results.csv ]; then
            cp src/trading_bot/scanner_results.csv ./scanner_results.csv
          fi
          
          # Ajoute le fichier CSV à la racine
          git add scanner_results.csv
          
          # Ne commite que s'il y a de réels changements (évite une erreur si le fichier est inchangé)
          git diff --staged --quiet || git commit -m "chore: update scanner results CSV automatically [skip ci]"
          
          # Pousse les modifications sur la branche principale
          git push